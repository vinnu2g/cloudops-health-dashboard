<!DOCTYPE html>
<html>
<head>
    <title>CloudOps Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            text-align: center;
            padding-top: 60px;
        }

        .card {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .status {
            color: green;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>CloudOps Health Dashboard</h1>

        <p class="status">● Healthy</p>

        <p>Application is running successfully on Microsoft Azure..</p>

    </div>

</body>
</html>
