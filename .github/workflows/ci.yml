name: CloudOps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest

      - name: Build Docker image
        run: |
          docker build -t cloudops-dashboard .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name cloudopsvinayak

      - name: Tag and push image to ACR
        run: |
          docker tag cloudops-dashboard:latest cloudopsvinayak-czg5aafsefddbch0.azurecr.io/cloudops-dashboard:${{ github.sha }}
          docker push cloudopsvinayak-czg5aafsefddbch0.azurecr.io/cloudops-dashboard:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name cloudops-dashboard \
            --resource-group cloudops-rg \
            --image cloudopsvinayak-czg5aafsefddbch0.azurecr.io/cloudops-dashboard:${{ github.sha }}